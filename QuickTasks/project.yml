# XcodeGen spec used to generate QuickTasks.xcodeproj (run `xcodegen generate` in this folder on a Mac).
# A single-target, Watch-only SwiftUI app (no iOS companion).
name: QuickTasks
options:
  bundleIdPrefix: lk.ac.sliit
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  QuickTasks:
    type: application
    platform: watchOS
    sources:
      - QuickTasks
    settings:
      base:
        PRODUCT_NAME: QuickTasks
        PRODUCT_BUNDLE_IDENTIFIER: lk.ac.sliit.QuickTasks.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quick Tasks
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
  QuickTasksUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - QuickTasksUITests
    dependencies:
      - target: QuickTasks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.ac.sliit.QuickTasks.watchkitapp.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuickTasks
schemes:
  QuickTasks:
    build:
      targets:
        QuickTasks: all
    test:
      targets:
        - QuickTasksUITests
